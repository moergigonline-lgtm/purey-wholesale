<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purey cover type options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--wine:#8b1119; --ink:#111; --paper:#f7f1ee; --f-sans:"IBM Plex Sans Arabic",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace; --f-script:"Markazi Text",serif; --g:clamp(16px,2.4cqi,26px)}
*{box-sizing:border-box} body{margin:0; background:#fff; color:var(--ink); font-family:var(--f-sans)}
.wrap{max-width:1180px; margin:0 auto; padding:40px 24px 80px}
h1{font:600 15px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; direction:ltr; text-align:left; margin:0 0 34px; color:#666}
.opt{margin:0 0 90px}
.opt h2{display:flex; gap:14px; align-items:baseline; margin:0 0 6px; font:600 26px/1.3 var(--f-sans)}
.opt h2 b{font:500 13px/1 var(--f-mono); color:var(--wine); direction:ltr}
.opt h2,.opt p{direction:ltr; text-align:left} .opt h2{justify-content:flex-start}
.opt p{margin:0 0 22px; color:#555; font-size:15px; line-height:1.7; max-width:720px}

/* the real home grid */
.tiles{display:grid; gap:clamp(14px,1.6vw,22px); grid-template-columns:1.15fr 1fr 1fr;
  grid-template-rows:clamp(230px,25vw,350px) clamp(190px,18vw,260px) clamp(260px,29vw,420px);
  grid-template-areas:"a b b" "a c c" "d d e"}
.tile{position:relative; display:block; border-radius:28px; overflow:hidden; background:#2a1418; color:#fff; min-width:0; min-height:0; container-type:inline-size; text-decoration:none}
.ta{grid-area:a} .tb{grid-area:b} .tc{grid-area:c} .td{grid-area:d} .te{grid-area:e}
.cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tile:hover .cover{transform:scale(1.035)}
.ta .cover{object-position:40% 50%} .tc .cover{object-position:78% 35%} .td .cover{object-position:62% 50%} .te .cover{object-position:50% 30%}
.en{direction:ltr; font-family:var(--f-mono); text-transform:uppercase}

/* ── A · Swiss grid: every tile shares one structure — index top, rule + name bottom, same margins ── */
.A .tile::after{content:""; position:absolute; inset:auto 0 0 0; height:62%; background:linear-gradient(to top,rgba(20,6,9,.72),rgba(20,6,9,0)); pointer-events:none}
.A .meta{position:absolute; z-index:1; inset:var(--g) var(--g) auto var(--g); display:flex; justify-content:space-between; font:500 12px/1 var(--f-mono); letter-spacing:.12em; direction:ltr}
.A .foot{position:absolute; z-index:1; inset:auto var(--g) var(--g) var(--g); border-top:1px solid rgba(255,255,255,.55); padding-top:12px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px}
.A .nm{font:600 clamp(26px,7cqi,46px)/1.05 var(--f-sans); letter-spacing:-.01em}
.A .foot .en{font-size:11px; letter-spacing:.2em; opacity:.85; padding-bottom:6px}

/* ── B · Catalogue plate: type moves off the photo onto a paper strip under it ── */
.B .tile{display:grid; grid-template-rows:1fr auto; background:var(--paper); color:var(--ink)}
.B .tile .cover{position:relative; inset:auto; grid-row:1; min-height:0}
.B .ph{position:relative; overflow:hidden; min-height:0}
.B .plate{display:grid; grid-template-columns:auto 1fr auto; align-items:baseline; gap:14px; padding:14px var(--g) 16px; border-top:1px solid rgba(17,17,17,.12)}
.B .idx{font:500 12px/1 var(--f-mono); color:var(--wine); direction:ltr}
.B .nm{font:600 clamp(19px,3.4cqi,26px)/1.2 var(--f-sans)}
.B .plate .en{font-size:11px; letter-spacing:.16em; color:#777}

/* ── C · Monumental crop: one huge word anchored to the bottom edge, cropped by the tile ── */
.C .tile::after{content:""; position:absolute; inset:auto 0 0 0; height:45%; background:linear-gradient(to top,rgba(20,6,9,.55),rgba(20,6,9,0)); pointer-events:none}
.C .big{position:absolute; z-index:1; inset-inline:calc(var(--g)*-.1) auto; bottom:-.1em; font:700 100px/.9 var(--f-sans); letter-spacing:-.03em; white-space:nowrap; color:#fff; mix-blend-mode:normal; opacity:.94; inset-inline-start:var(--g)}
.C .meta{position:absolute; z-index:1; inset:var(--g) var(--g) auto var(--g); display:flex; justify-content:space-between; font:500 12px/1 var(--f-mono); letter-spacing:.12em; direction:ltr}

/* ── D · Colour field: a solid wine block owns the text; the photo owns the rest ── */
.D .tile{display:grid; grid-template-columns:minmax(150px,34%) minmax(0,1fr); grid-template-rows:minmax(0,1fr)}
.D .tile .cover{height:100%; min-height:0}
.D .tile .cover{position:relative; grid-column:2; grid-row:1}
.D .field{container-type:inline-size; grid-column:1; grid-row:1; background:var(--wine); padding:var(--g); display:flex; flex-direction:column; justify-content:space-between; z-index:1}
.D .idx{font:500 12px/1 var(--f-mono); letter-spacing:.12em; direction:ltr; text-align:left; opacity:.8}
.D .nm{display:block; font:600 clamp(20px,14cqi,40px)/1.15 var(--f-sans)}
.D .rule{height:1px; background:rgba(255,255,255,.5); margin:12px 0 10px}
.D .field .en{font-size:11px; letter-spacing:.18em; opacity:.85}
.D .ta{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto}
.D .ta .cover{grid-column:1; grid-row:1} .D .ta .field{grid-column:1; grid-row:2; gap:28px}
.D .te .field{gap:22px}
.D .te{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto}
.D .te .cover{grid-column:1; grid-row:1} .D .te .field{grid-column:1; grid-row:2}
</style>
</head>
<body>
<div class="wrap">
  <h1>Purey · collection cover type · 4 options</h1>
  <div id="out"></div>
</div>
<script>
const T = [
  { c:'ta', img:'cover-cotton', ar:'بجامات قطني', en:'Cotton', n:69, i:'01' },
  { c:'tb', img:'cover-satin', ar:'بجامات ستان', en:'Satin', n:50, i:'02' },
  { c:'tc', img:'cover-lingerie', ar:'لانجري', en:'Lingerie', n:27, i:'04' },
  { c:'td', img:'cover-robes', ar:'ارواب وعرائيسي', en:'Robes · Bridal', n:20, i:'03' },
  { c:'te', img:'cover-sets', ar:'طواقم داخلي', en:'Sets', n:60, i:'05' },
];
const img = (t) => `<img class="cover" src="img/${t.img}.webp" alt="">`;
const O = [
  ['A','Swiss grid','Every tile gets the same skeleton: index and count on the top margin, a hairline and the name on the bottom margin, with identical gutters. The type sits on a grid instead of wherever the photo has space. A soft bottom shade keeps it readable.',
    (t) => `${img(t)}<span class="meta"><span>${t.i}</span><span>${t.n} PCS</span></span><span class="foot"><span class="nm">${t.ar}</span><span class="en">${t.en}</span></span>`],
  ['B','Catalogue plate','Type leaves the photo entirely. Each cover becomes a plate: the photo above, a paper strip below with the index, the name and the English label on one baseline. Calm and editorial, and it never fights the image.',
    (t) => `<span class="ph">${img(t)}</span><span class="plate"><span class="idx">${t.i}</span><span class="nm">${t.ar}</span><span class="en">${t.en} · ${t.n}</span></span>`],
  ['C','Monumental crop','One oversized word anchored to the bottom edge and cropped by the tile, poster style. The name becomes part of the composition instead of a caption on top of it.',
    (t) => `${img(t)}<span class="meta"><span>${t.i} — ${t.en.toUpperCase()}</span><span>${t.n}</span></span><span class="big">${t.ar}</span>`],
  ['D','Colour field','A solid Purey wine block holds all the type, set flush to a grid, and the photo fills the rest. Classic Swiss colour-block layout. It ties the covers to the brand colour and keeps text off the image.',
    (t) => `${img(t)}<span class="field"><span class="idx">${t.i}</span><span><span class="nm">${t.ar}</span><span class="rule" style="display:block"></span><span class="en">${t.en} · ${t.n}</span></span></span>`],
];
document.getElementById('out').innerHTML = O.map(([k, name, why, f]) => `
  <section class="opt ${k}"><h2><b>${k}</b>${name}</h2><p>${why}</p>
    <div class="tiles">${T.map((t) => `<a class="tile ${t.c}" href="#">${f(t)}</a>`).join('')}</div></section>`).join('');
// C: size each giant word so it spans the tile width minus the gutters
function fit(){ document.querySelectorAll('.C .big').forEach((b) => { const w = b.parentElement.clientWidth * 0.9; b.style.fontSize = '100px'; b.style.fontSize = Math.min(220, 100 * w / b.scrollWidth, b.parentElement.clientHeight * 0.5) + 'px'; }); }
document.fonts.ready.then(fit); addEventListener('resize', fit);
</script>
</body>
</html>
